name: Claude Code

# No `issues` trigger: planning lives in Linear, and on a public repo anyone can open an issue.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    # This repo is public, so only the owner can start a run, on top of the action's own write-access check.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Keep checkout's credential: with commit signing on, the action skips its own git auth and fetches the PR branch with this one.
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # v1.0.250, the release AssemblyOps' workflows run.
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Commits go through GitHub's API so they are signed; the ruleset requires signed commits.
          use_commit_signing: true
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Agent,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh run view:*)"
            --append-system-prompt "You are tagged Claude on a GitHub pull request. Read AGENTS.md and docs/delivery/review.md before acting; the Tagged Claude and review-record rules govern this run."
